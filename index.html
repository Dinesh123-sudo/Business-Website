<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    keyframes: {
                        'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        'slide-in-top': { '0%': { transform: 'translateY(-20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        'slide-in-bottom': { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
                    },
                    animation: {
                        'fade-in': 'fade-in 0.7s ease-out forwards',
                        'slide-in-top': 'slide-in-top 0.5s ease-out forwards',
                        'slide-in-bottom': 'slide-in-bottom 0.7s ease-out forwards',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; background-color: #f8fafc; }
        h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        #root:empty::after {
            content: "Initializing WorldClass Gallery...";
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Playfair Display', serif; font-size: 1.1rem; color: #94a3b8;
        }
    </style>
<script type="importmap">
{
  "imports": {

</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script type="module">
        window.addEventListener('error', function(e) {
            console.error('Application Error:', e.error);
            if (document.getElementById('root') && document.getElementById('root').innerHTML === "") {
                document.getElementById('root').innerHTML = `
                    <div style="padding: 60px; text-align: center; font-family: sans-serif; background: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                        <span style="font-size: 40px;">🧵</span>
                        <h2 style="color: #9d174d; font-family: 'Playfair Display', serif; margin-top: 20px;">System Handshake Failed</h2>
                        <p style="color: #64748b; max-width: 400px; line-height: 1.6;">We encountered a technical issue while weaving your experience. This is usually caused by a version conflict in the browser modules.</p>
                        <button onclick="window.location.reload(true)" style="background: #0f172a; color: white; border: none; padding: 14px 28px; border-radius: 50px; cursor: pointer; margin-top: 24px; font-weight: bold; transition: all 0.3s;">Hard Refresh Collection</button>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
